name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Allow http traffic to the NodeMCU
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$F" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$F"
          grep -n "usesCleartextTraffic" "$F"

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rit-iot-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
